name: Guided Real-Data Mode Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/server/application.py'
      - 'workbench/server/tests/test_guided_real_data_mode.py'
      - '.github/workflows/guided-real-data-mode-tests.yml'
  push:
    branches: [master, develop]
    paths:
      - 'workbench/server/application.py'
      - 'workbench/server/tests/test_guided_real_data_mode.py'
      - '.github/workflows/guided-real-data-mode-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  normalization-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python syntax
        run: |
          python3 -m py_compile \
            workbench/server/application.py \
            workbench/server/tests/test_guided_real_data_mode.py

      - name: Run guided mode regression tests
        run: python3 workbench/server/tests/test_guided_real_data_mode.py -v
