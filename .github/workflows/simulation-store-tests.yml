name: Persistent Simulation Store Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/simulation_store.py'
      - 'workbench/_simulation_store_sqlite.py'
      - 'workbench/_simulation_store_dependency_core.py'
      - 'workbench/era5_dependency_lock.py'
      - 'workbench/server/tests/test_simulation_store.py'
      - 'workbench/server/tests/test_simulation_store_validation.py'
      - 'workbench/server/tests/test_era5_cache_simulation_dependencies.py'
      - 'doc/PERSISTENT_SIMULATION_JOBS.md'
      - '.github/workflows/simulation-store-tests.yml'
  push:
    branches: [master, develop]
    paths:
      - 'workbench/simulation_store.py'
      - 'workbench/_simulation_store_sqlite.py'
      - 'workbench/_simulation_store_dependency_core.py'
      - 'workbench/era5_dependency_lock.py'
      - 'workbench/server/tests/test_simulation_store.py'
      - 'workbench/server/tests/test_simulation_store_validation.py'
      - 'workbench/server/tests/test_era5_cache_simulation_dependencies.py'
      - 'doc/PERSISTENT_SIMULATION_JOBS.md'
      - '.github/workflows/simulation-store-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

concurrency:
  group: persistent-simulation-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python syntax
        run: |
          python3 -m py_compile \
            workbench/simulation_store.py \
            workbench/_simulation_store_sqlite.py \
            workbench/_simulation_store_dependency_core.py \
            workbench/era5_dependency_lock.py \
            workbench/server/tests/test_simulation_store_validation.py \
            workbench/server/tests/test_era5_cache_simulation_dependencies.py

      - name: Run SQLite state-machine tests
        shell: bash
        run: |
          python3 workbench/server/tests/test_simulation_store.py -v \
            > "${RUNNER_TEMP}/simulation-store-tests.log" 2>&1 || {
              cat "${RUNNER_TEMP}/simulation-store-tests.log"
              exit 1
            }
          cat "${RUNNER_TEMP}/simulation-store-tests.log"

      - name: Run immutable-boundary and path tests
        shell: bash
        run: |
          python3 workbench/server/tests/test_simulation_store_validation.py -v \
            > "${RUNNER_TEMP}/simulation-store-validation-tests.log" 2>&1 || {
              cat "${RUNNER_TEMP}/simulation-store-validation-tests.log"
              exit 1
            }
          cat "${RUNNER_TEMP}/simulation-store-validation-tests.log"

      - name: Run ERA5 plan dependency tests
        shell: bash
        run: |
          python3 workbench/server/tests/test_era5_cache_simulation_dependencies.py -v \
            > "${RUNNER_TEMP}/simulation-store-era5-dependency-tests.log" 2>&1 || {
              cat "${RUNNER_TEMP}/simulation-store-era5-dependency-tests.log"
              exit 1
            }
          cat "${RUNNER_TEMP}/simulation-store-era5-dependency-tests.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-simulation-store-test-logs
          path: ${{ runner.temp }}/simulation-store-*.log
          if-no-files-found: error
