name: ERA5 Data API Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ci/download-era5.py'
      - 'ci/validate-cds-credentials.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/era5_credential_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_planner.py'
      - 'workbench/server/application.py'
      - 'workbench/server/tests/test_cds_credential_validator.py'
      - 'workbench/server/tests/test_era5_cache_api.py'
      - 'workbench/server/tests/test_era5_cache_service.py'
      - 'workbench/server/tests/test_era5_credential_api.py'
      - 'workbench/server/tests/test_era5_credential_service.py'
      - 'workbench/server/tests/test_era5_data_api.py'
      - 'workbench/server/tests/test_era5_download_api.py'
      - 'workbench/server/tests/test_era5_download_manager.py'
      - 'workbench/server/tests/test_era5_download_path_security.py'
      - 'workbench/server/tests/test_ui_public_asset_build.py'
      - 'workbench/ui/index.html'
      - 'workbench/ui/public/era5-cache-management.js'
      - 'workbench/ui/public/era5-credential-validation.js'
      - 'workbench/ui/public/era5-download-control.js'
      - 'workbench/web/index.html'
      - 'workbench/web/era5-cache-management.js'
      - 'workbench/web/era5-credential-validation.js'
      - 'workbench/web/era5-download-control.js'
      - '.github/workflows/era5-data-api-tests.yml'
  push:
    branches: [master, develop]
    paths:
      - 'ci/download-era5.py'
      - 'ci/validate-cds-credentials.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/era5_credential_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_planner.py'
      - 'workbench/server/application.py'
      - 'workbench/server/tests/test_cds_credential_validator.py'
      - 'workbench/server/tests/test_era5_cache_api.py'
      - 'workbench/server/tests/test_era5_cache_service.py'
      - 'workbench/server/tests/test_era5_credential_api.py'
      - 'workbench/server/tests/test_era5_credential_service.py'
      - 'workbench/server/tests/test_era5_data_api.py'
      - 'workbench/server/tests/test_era5_download_api.py'
      - 'workbench/server/tests/test_era5_download_manager.py'
      - 'workbench/server/tests/test_era5_download_path_security.py'
      - 'workbench/server/tests/test_ui_public_asset_build.py'
      - 'workbench/ui/index.html'
      - 'workbench/ui/public/era5-cache-management.js'
      - 'workbench/ui/public/era5-credential-validation.js'
      - 'workbench/ui/public/era5-download-control.js'
      - 'workbench/web/index.html'
      - 'workbench/web/era5-cache-management.js'
      - 'workbench/web/era5-credential-validation.js'
      - 'workbench/web/era5-download-control.js'
      - '.github/workflows/era5-data-api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: era5-data-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Persistent credential-safe ERA5 data jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ERA5 planner, credential, download, and cache tests
        shell: bash
        run: |
          LOG_FILE="${RUNNER_TEMP}/era5-data-api-tests.log"
          {
            python3 workbench/server/tests/test_cds_credential_validator.py -v
            python3 workbench/server/tests/test_era5_credential_service.py -v
            python3 workbench/server/tests/test_era5_data_api.py
            python3 workbench/server/tests/test_era5_download_manager.py -v
            python3 workbench/server/tests/test_era5_download_path_security.py -v
            python3 workbench/server/tests/test_era5_cache_service.py -v
            python3 workbench/server/tests/test_ui_public_asset_build.py
            python3 workbench/server/tests/test_era5_credential_api.py
            python3 workbench/server/tests/test_era5_download_api.py
            python3 workbench/server/tests/test_era5_cache_api.py
          } >"${LOG_FILE}" 2>&1 || {
            cat "${LOG_FILE}"
            exit 1
          }
          cat "${LOG_FILE}"

      - name: Verify browser controls syntax
        shell: bash
        run: |
          node --check workbench/web/era5-credential-validation.js
          node --check workbench/web/era5-download-control.js
          node --check workbench/web/era5-cache-management.js

      - name: Upload ERA5 API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era5-data-api-test-log
          path: ${{ runner.temp }}/era5-data-api-tests.log
          if-no-files-found: error
