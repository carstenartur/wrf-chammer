name: User Guide Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/server/**'
      - 'workbench/e2e/**'
      - 'ci/generate-user-guide-screenshots.sh'
      - 'ci/verify-user-guide-map-provenance.py'
      - 'doc/USER_GUIDE.md'
      - 'doc/user-guide/**'
      - '.github/workflows/user-guide-screenshots.yml'
  workflow_dispatch:
    inputs:
      basemap:
        description: Basemap used for the generated artifact
        required: true
        default: offline-natural-earth
        type: choice
        options:
          - offline-natural-earth
          - openstreetmap

concurrency:
  group: user-guide-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xaver-user-guide-screenshots:
    name: Generate Xaver user-guide screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select screenshot basemap and isolated output
        env:
          REQUESTED_BASEMAP: ${{ github.event_name == 'workflow_dispatch' && inputs.basemap || 'offline-natural-earth' }}
        run: |
          case "${REQUESTED_BASEMAP}" in
            openstreetmap)
              OUTPUT_DIR='workbench-runs/manual-openstreetmap-screenshots'
              ALLOW_LIVE='1'
              ;;
            offline-natural-earth)
              OUTPUT_DIR='workbench-runs/ci-user-guide-screenshots'
              ALLOW_LIVE=''
              ;;
            *)
              echo "Unsupported screenshot basemap: ${REQUESTED_BASEMAP}" >&2
              exit 2
              ;;
          esac
          echo "WRF_SCREENSHOT_BASEMAP=${REQUESTED_BASEMAP}" >> "${GITHUB_ENV}"
          echo "WRF_SCREENSHOT_OUTPUT_DIR=${OUTPUT_DIR}" >> "${GITHUB_ENV}"
          echo "WRF_ALLOW_LIVE_OSM_SCREENSHOTS=${ALLOW_LIVE}" >> "${GITHUB_ENV}"
          echo "SCREENSHOT_ARTIFACT_DIR=${OUTPUT_DIR}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run screenshot integration test in Testcontainers
        run: |
          LOG_FILE="${RUNNER_TEMP}/user-guide-screenshots.log"
          if ! (
            cd workbench/e2e
            npm install
            npm run screenshots:container
          ) >"${LOG_FILE}" 2>&1
          then
            echo "Screenshot integration failed. Last 250 log lines:"
            tail -n 250 "${LOG_FILE}"
            exit 1
          fi
          echo "Screenshot integration succeeded. Last 60 log lines:"
          tail -n 60 "${LOG_FILE}"

      - name: Upload screenshot integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-screenshot-diagnostics
          path: ${{ runner.temp }}/user-guide-screenshots.log
          if-no-files-found: warn

      - name: Verify generated screenshots and basemap provenance
        run: |
          for file in \
            xaver-01-search.png \
            xaver-02-event-selected.png \
            xaver-03-domain-resolution.png \
            xaver-03b-map-domain-wizard.png \
            xaver-03c-era5-data-plan.png \
            xaver-04-preview-config.png \
            xaver-05-dry-run-status.png \
            xaver-06-logs.png
          do
            if [ ! -f "${SCREENSHOT_ARTIFACT_DIR}/${file}" ]; then
              echo "Missing generated screenshot: ${SCREENSHOT_ARTIFACT_DIR}/${file}"
              exit 1
            fi
          done
          test -f "${SCREENSHOT_ARTIFACT_DIR}/xaver-03b-map-domain-wizard.png.provenance.json"
          if [ "${WRF_SCREENSHOT_BASEMAP}" = 'openstreetmap' ]; then
            python3 ci/verify-user-guide-map-provenance.py \
              "${SCREENSHOT_ARTIFACT_DIR}/xaver-03b-map-domain-wizard.png.provenance.json"
          fi

      - name: Verify checked-in OpenStreetMap documentation provenance
        run: python3 ci/verify-user-guide-map-provenance.py

      - name: Upload generated screenshots and basemap provenance
        uses: actions/upload-artifact@v4
        with:
          name: xaver-user-guide-screenshots
          path: |
            workbench-runs/ci-user-guide-screenshots/*.png
            workbench-runs/ci-user-guide-screenshots/*.provenance.json
            workbench-runs/manual-openstreetmap-screenshots/*.png
            workbench-runs/manual-openstreetmap-screenshots/*.provenance.json
          if-no-files-found: error

      - name: Upload generated UI assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-ui-assets
          path: |
            workbench/web/index.html
            workbench/web/app.js
            workbench/web/styles.css
          if-no-files-found: warn
