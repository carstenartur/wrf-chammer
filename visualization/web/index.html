<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WRF Weather Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e0e4ef;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: #1a1d2e;
    border-bottom: 1px solid #2a2d3e;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
  #job-id-label { font-size: 0.8rem; color: #8890a8; margin-top: 2px; }

  /* ── Main layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px;
    min-width: 220px;
    background: #13161f;
    border-right: 1px solid #2a2d3e;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px 12px;
    gap: 18px;
  }

  .sidebar section { display: flex; flex-direction: column; gap: 8px; }
  .sidebar h2 {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #5f6478;
    padding-bottom: 4px;
    border-bottom: 1px solid #1e2130;
  }

  .layer-btn {
    background: #1a1d2e;
    border: 1px solid #2a2d3e;
    border-radius: 6px;
    color: #c8cedf;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 0.82rem;
    text-align: left;
    transition: background .15s, border-color .15s;
  }
  .layer-btn:hover { background: #20243a; border-color: #3b4060; }
  .layer-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
  .layer-meta { font-size: 0.7rem; color: #5f6478; margin-top: 2px; }

  /* ── Time controls ── */
  #time-display {
    font-size: 0.78rem;
    color: #93c5fd;
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
  }
  .time-controls { display: flex; gap: 6px; align-items: center; }
  .time-controls button {
    background: #1a1d2e;
    border: 1px solid #2a2d3e;
    border-radius: 5px;
    color: #c8cedf;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: background .12s;
  }
  .time-controls button:hover { background: #20243a; }
  .time-controls button.active { background: #1e3a5f; border-color: #3b82f6; }

  #time-slider { width: 100%; accent-color: #3b82f6; cursor: pointer; }
  #time-idx-label { font-size: 0.7rem; color: #5f6478; text-align: right; }

  /* ── Value range bar ── */
  .colorbar {
    height: 12px;
    border-radius: 4px;
    background: linear-gradient(to right,
      #0a0a5a, #1a237e, #1565c0, #0288d1,
      #00acc1, #00897b, #66bb6a,
      #ffee58, #ff9800, #e53935);
    margin-top: 4px;
  }
  .colorbar-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.67rem;
    color: #5f6478;
    margin-top: 2px;
  }

  /* ── Map/canvas area ── */
  .map-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #main-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    image-rendering: pixelated;
  }

  /* ── Tooltip ── */
  #tooltip {
    position: absolute;
    background: rgba(15, 17, 23, 0.92);
    border: 1px solid #3b82f6;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.78rem;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 220px;
    line-height: 1.5;
  }
  #tooltip .tip-coord { color: #8890a8; font-size: 0.7rem; }

  /* ── Status bar ── */
  #status-bar {
    background: #13161f;
    border-top: 1px solid #2a2d3e;
    padding: 6px 16px;
    font-size: 0.72rem;
    color: #5f6478;
    display: flex;
    gap: 20px;
  }
  #status-bar span { display: inline-flex; gap: 5px; }
  #status-bar .val { color: #8890a8; }

  /* ── Error / loading states ── */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 23, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-size: 0.9rem;
    color: #8890a8;
    z-index: 200;
  }
  #overlay.hidden { display: none; }
  #overlay .error-msg { color: #f87171; font-size: 0.85rem; max-width: 400px; text-align: center; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🌪 WRF Weather Viewer</h1>
    <div id="job-id-label">Loading…</div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">

    <section id="layers-section">
      <h2>Layers</h2>
      <div id="layer-list"><!-- populated by JS --></div>
    </section>

    <section>
      <h2>Time</h2>
      <div id="time-display">—</div>
      <div class="time-controls">
        <button id="btn-prev" title="Previous step">◀</button>
        <button id="btn-play" title="Play/Pause">▶</button>
        <button id="btn-next" title="Next step">▶▶</button>
      </div>
      <input type="range" id="time-slider" min="0" value="0">
      <div id="time-idx-label">step 0 / 0</div>
    </section>

    <section id="colorbar-section">
      <h2>Scale</h2>
      <div id="layer-unit" style="font-size:0.75rem;color:#8890a8;margin-bottom:4px;">—</div>
      <div class="colorbar" id="colorbar"></div>
      <div class="colorbar-labels">
        <span id="cb-min">0</span>
        <span id="cb-max">1</span>
      </div>
    </section>

    <section id="point-section">
      <h2>Point inspection</h2>
      <div id="point-info" style="font-size:0.78rem;color:#8890a8;">
        Click on the map to inspect a grid point.
      </div>
    </section>

  </aside>

  <div class="map-area">
    <canvas id="main-canvas"></canvas>
    <div id="tooltip"></div>
    <div id="overlay">
      <div>Loading metadata…</div>
      <div class="error-msg" id="overlay-error"></div>
    </div>
  </div>
</div>

<div id="status-bar">
  <span>Grid: <span class="val" id="sb-grid">—</span></span>
  <span>Bounds: <span class="val" id="sb-bounds">—</span></span>
  <span>Layer: <span class="val" id="sb-layer">—</span></span>
  <span>Cursor: <span class="val" id="sb-cursor">—</span></span>
</div>

<script>
/* ============================================================
   WRF Weather Viewer — pure vanilla JS, no CDN dependencies
   ============================================================
   Loads metadata.json from the same directory as this HTML file,
   then fetches individual layer JSON files on demand.

   Data contract (from postprocess.py output):
     metadata.json  — job/domain/layer catalogue
     layers/*.json  — per-layer data (time-varying or max)
   ============================================================ */

// ── Configuration ──────────────────────────────────────────────────────────

const CONFIG = {
  metadataPath: "metadata.json",
  playIntervalMs: 600,
};

// ── Colour maps ─────────────────────────────────────────────────────────────

const COLORMAPS = {
  wind: [
    [10,  10,  90],  // very dark blue – calm
    [26,  35, 126],
    [21, 101, 192],
    [ 2, 136, 209],
    [ 0, 172, 193],
    [ 0, 137, 123],
    [102, 187, 106],
    [255, 238,  88],
    [255, 152,   0],
    [229,  57,  53],
  ],
  temp: [
    [  8,  81, 156],   // cold blue
    [ 33, 113, 181],
    [ 66, 146, 198],
    [107, 174, 214],
    [189, 215, 231],
    [239, 243, 255],
    [252, 174, 145],
    [251, 106,  74],
    [222,  45,  38],
    [165,  15,  21],   // hot red
  ],
  pressure: [
    [  0,   0,  80],
    [ 20,  60, 160],
    [ 40, 120, 220],
    [ 80, 180, 255],
    [160, 230, 255],
    [255, 255, 255],
    [255, 200, 100],
    [255, 130,  30],
    [200,  50,   0],
    [100,   0,   0],
  ],
  rain: [
    [240, 248, 255],
    [176, 224, 230],
    [100, 180, 255],
    [ 30, 120, 255],
    [  0,  60, 200],
    [  0, 100, 100],
    [  0, 150,   0],
    [150, 200,  50],
    [255, 255,  50],
    [255, 100,   0],
  ],
  default: [
    [  0,   0,  80],
    [ 20,  60, 160],
    [  0, 160, 255],
    [  0, 220, 200],
    [ 60, 220,  60],
    [220, 220,   0],
    [255, 140,   0],
    [255,  60,   0],
    [200,   0,  80],
    [100,   0,  50],
  ],
};

function layerColormap(layerId) {
  if (layerId.includes("wind"))     return COLORMAPS.wind;
  if (layerId.includes("t2"))       return COLORMAPS.temp;
  if (layerId.includes("psfc"))     return COLORMAPS.pressure;
  if (layerId.includes("rain"))     return COLORMAPS.rain;
  return COLORMAPS.default;
}

function interpolateColor(cmap, t) {
  // t in [0, 1]
  t = Math.max(0, Math.min(1, t));
  const idx = t * (cmap.length - 1);
  const lo  = Math.floor(idx);
  const hi  = Math.min(lo + 1, cmap.length - 1);
  const f   = idx - lo;
  return [
    Math.round(cmap[lo][0] + f * (cmap[hi][0] - cmap[lo][0])),
    Math.round(cmap[lo][1] + f * (cmap[hi][1] - cmap[lo][1])),
    Math.round(cmap[lo][2] + f * (cmap[hi][2] - cmap[lo][2])),
  ];
}

// ── State ───────────────────────────────────────────────────────────────────

const state = {
  metadata: null,
  layerCache: {},        // layerId → loaded layer object
  activeLayerId: null,
  timeIdx: 0,
  playing: false,
  playTimer: null,
};

// ── DOM helpers ─────────────────────────────────────────────────────────────

const $ = id => document.getElementById(id);

function showOverlay(msg, isError = false) {
  $("overlay").classList.remove("hidden");
  $("overlay").querySelector("div").textContent = msg;
  $("overlay-error").textContent = "";
  if (isError) {
    $("overlay").querySelector("div").textContent = "";
    $("overlay-error").textContent = msg;
  }
}

function hideOverlay() {
  $("overlay").classList.add("hidden");
}

// ── Canvas rendering ─────────────────────────────────────────────────────────

const canvas = $("main-canvas");
const ctx    = canvas.getContext("2d");

function resizeCanvas() {
  const area = canvas.parentElement.getBoundingClientRect();
  canvas.width  = Math.floor(area.width);
  canvas.height = Math.floor(area.height);
}

function renderLayer(layer, timeIdx) {
  if (!layer) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  let grid;
  if (layer.type === "raster-time-series") {
    const frames = layer.frames || [];
    grid = frames[Math.min(timeIdx, frames.length - 1)] || [];
  } else if (layer.type === "raster-max") {
    grid = layer.data || [];
  } else {
    return;
  }

  const ny   = grid.length;
  const nx   = ny > 0 ? grid[0].length : 0;
  if (nx === 0 || ny === 0) return;

  const vmin = layer.vmin;
  const vmax = layer.vmax;
  const range = vmax - vmin || 1;
  const cmap  = layerColormap(layer.id);

  const cellW = canvas.width  / nx;
  const cellH = canvas.height / ny;

  // Build ImageData for performance
  const imgData = ctx.createImageData(canvas.width, canvas.height);
  const pixels  = imgData.data;

  for (let py = 0; py < canvas.height; py++) {
    const j = Math.floor(py / cellH);
    const row = grid[Math.min(j, ny - 1)];
    for (let px = 0; px < canvas.width; px++) {
      const i  = Math.floor(px / cellW);
      const v  = row[Math.min(i, nx - 1)];
      const t  = (v - vmin) / range;
      const [r, g, b] = interpolateColor(cmap, t);
      const off = (py * canvas.width + px) * 4;
      pixels[off]     = r;
      pixels[off + 1] = g;
      pixels[off + 2] = b;
      pixels[off + 3] = 220;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Draw grid lines (thin, semi-transparent) for small grids
  if (nx <= 20 && ny <= 20) {
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= nx; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellW, 0);
      ctx.lineTo(i * cellW, canvas.height);
      ctx.stroke();
    }
    for (let j = 0; j <= ny; j++) {
      ctx.beginPath();
      ctx.moveTo(0,            j * cellH);
      ctx.lineTo(canvas.width, j * cellH);
      ctx.stroke();
    }
  }
}

// ── Layer management ─────────────────────────────────────────────────────────

async function fetchLayer(layerId) {
  if (state.layerCache[layerId]) return state.layerCache[layerId];

  const meta = state.metadata;
  const entry = meta.layers.find(l => l.id === layerId);
  if (!entry) throw new Error(`Layer '${layerId}' not in metadata`);

  const response = await fetch(entry.file);
  if (!response.ok) throw new Error(`Failed to fetch ${entry.file}: ${response.status}`);
  const layer = await response.json();
  state.layerCache[layerId] = layer;
  return layer;
}

async function activateLayer(layerId) {
  showOverlay("Loading layer…");
  try {
    const layer = await fetchLayer(layerId);
    state.activeLayerId = layerId;

    // Update UI
    document.querySelectorAll(".layer-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.id === layerId);
    });

    const entry = state.metadata.layers.find(l => l.id === layerId);
    $("layer-unit").textContent = entry ? entry.unit : "";
    $("cb-min").textContent = entry ? Number(entry.vmin).toFixed(2) : "0";
    $("cb-max").textContent = entry ? Number(entry.vmax).toFixed(2) : "1";
    $("sb-layer").textContent = entry ? entry.label : layerId;

    // Update colorbar gradient to match colormap
    const cmap = layerColormap(layerId);
    const stops = cmap.map((c, idx) => {
      const pct = Math.round(idx / (cmap.length - 1) * 100);
      return `rgb(${c[0]},${c[1]},${c[2]}) ${pct}%`;
    });
    $("colorbar").style.background = `linear-gradient(to right, ${stops.join(", ")})`;

    // Determine max time index
    const nTimes = (layer.times || []).length || (layer.frames || []).length || 1;
    const slider = $("time-slider");
    slider.max   = Math.max(0, nTimes - 1);
    slider.value = Math.min(state.timeIdx, slider.max);
    state.timeIdx = parseInt(slider.value, 10);
    $("time-idx-label").textContent = `step ${state.timeIdx + 1} / ${nTimes}`;

    renderLayer(layer, state.timeIdx);
    updateTimeDisplay(layer);
    hideOverlay();
  } catch (err) {
    showOverlay(`Failed to load layer '${layerId}': ${err.message}`, true);
  }
}

function updateTimeDisplay(layer) {
  const times = (layer && layer.times) || [];
  const t = times[state.timeIdx] || "";
  $("time-display").textContent = t || "(no time info)";
}

// ── Time controls ────────────────────────────────────────────────────────────

function setTimeIdx(idx) {
  const layer = state.layerCache[state.activeLayerId];
  if (!layer) return;
  const nTimes = (layer.times || []).length || (layer.frames || []).length || 1;
  state.timeIdx = Math.max(0, Math.min(idx, nTimes - 1));
  $("time-slider").value = state.timeIdx;
  $("time-idx-label").textContent = `step ${state.timeIdx + 1} / ${nTimes}`;
  renderLayer(layer, state.timeIdx);
  updateTimeDisplay(layer);
}

function togglePlay() {
  state.playing = !state.playing;
  $("btn-play").textContent = state.playing ? "⏸" : "▶";
  $("btn-play").classList.toggle("active", state.playing);
  if (state.playing) {
    state.playTimer = setInterval(() => {
      const layer = state.layerCache[state.activeLayerId];
      if (!layer) return;
      const nTimes = (layer.times || []).length || (layer.frames || []).length || 1;
      setTimeIdx((state.timeIdx + 1) % nTimes);
    }, CONFIG.playIntervalMs);
  } else {
    clearInterval(state.playTimer);
  }
}

// ── Mouse interaction ─────────────────────────────────────────────────────────

function canvasToGrid(px, py) {
  const layer = state.layerCache[state.activeLayerId];
  if (!layer) return null;
  let ny, nx;
  if (layer.type === "raster-time-series") {
    const frames = layer.frames || [];
    const frame = frames[state.timeIdx] || [];
    ny = frame.length;
    nx = ny > 0 ? frame[0].length : 0;
  } else {
    const g = layer.data || [];
    ny = g.length;
    nx = ny > 0 ? g[0].length : 0;
  }
  if (nx === 0 || ny === 0) return null;
  const j = Math.floor(py / canvas.height * ny);
  const i = Math.floor(px / canvas.width  * nx);
  return { i: Math.min(i, nx - 1), j: Math.min(j, ny - 1) };
}

function getGridValue(layer, i, j, timeIdx) {
  if (!layer) return null;
  if (layer.type === "raster-time-series") {
    const frames = layer.frames || [];
    const frame  = frames[Math.min(timeIdx, frames.length - 1)] || [];
    const row    = frame[j] || [];
    return row[i] !== undefined ? row[i] : null;
  }
  if (layer.type === "raster-max") {
    const row = (layer.data || [])[j] || [];
    return row[i] !== undefined ? row[i] : null;
  }
  return null;
}

function getGridCoords(i, j) {
  const meta = state.metadata;
  if (!meta) return null;
  // Try to load XLAT/XLONG from coordinate files
  const xlat  = state.layerCache["__xlat__"];
  const xlong = state.layerCache["__xlong__"];
  if (xlat && xlong) {
    const lat = (xlat[j] || [])[i];
    const lon = (xlong[j] || [])[i];
    if (lat !== undefined && lon !== undefined) {
      return { lat: lat.toFixed(3), lon: lon.toFixed(3) };
    }
  }
  // Fall back to linear interpolation from bounds
  const b  = meta.domain.bounds || [0, 0, 1, 1];
  const nx = meta.domain.nx || 1;
  const ny = meta.domain.ny || 1;
  const lon = (b[0] + (b[2] - b[0]) * i / Math.max(nx - 1, 1)).toFixed(3);
  const lat = (b[1] + (b[3] - b[1]) * j / Math.max(ny - 1, 1)).toFixed(3);
  return { lat, lon };
}

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const cell = canvasToGrid(px, py);
  if (!cell) { $("sb-cursor").textContent = "—"; return; }

  const layer = state.layerCache[state.activeLayerId];
  const val   = getGridValue(layer, cell.i, cell.j, state.timeIdx);
  const coords = getGridCoords(cell.i, cell.j);
  const unit  = (state.metadata && state.metadata.layers.find(l => l.id === state.activeLayerId) || {}).unit || "";

  $("sb-cursor").textContent = `grid(${cell.j},${cell.i}) = ${val !== null ? val.toFixed(3) : "?"}`;

  const tip = $("tooltip");
  tip.style.display = "block";
  tip.style.left = (e.offsetX + 14) + "px";
  tip.style.top  = (e.offsetY + 14) + "px";
  tip.innerHTML  =
    `<strong>${val !== null ? val.toFixed(3) : "?"} ${unit}</strong>` +
    (coords ? `<br><span class="tip-coord">lat ${coords.lat}° N, lon ${coords.lon}° E</span>` : "") +
    `<br><span class="tip-coord">grid (j=${cell.j}, i=${cell.i})</span>`;
});

canvas.addEventListener("mouseleave", () => {
  $("tooltip").style.display = "none";
  $("sb-cursor").textContent = "—";
});

canvas.addEventListener("click", e => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const cell = canvasToGrid(px, py);
  if (!cell) return;

  const layer  = state.layerCache[state.activeLayerId];
  const coords = getGridCoords(cell.i, cell.j);
  const unit   = (state.metadata && state.metadata.layers.find(l => l.id === state.activeLayerId) || {}).unit || "";

  // Build full timeseries for this point across all time-varying layers
  const lines = [];
  const meta  = state.metadata;
  if (meta) {
    for (const entry of meta.layers) {
      const lyr = state.layerCache[entry.id];
      if (!lyr || lyr.type !== "raster-time-series") continue;
      const times  = lyr.times || [];
      const frames = lyr.frames || [];
      if (times.length) {
        lines.push(`<strong>${entry.label} (${entry.unit})</strong>`);
        times.forEach((t, idx) => {
          const v = ((frames[idx] || [])[cell.j] || [])[cell.i];
          lines.push(`  ${t}: ${v !== undefined ? v.toFixed(3) : "?"}`);
        });
      }
    }
  }

  if (lines.length === 0) {
    const val = getGridValue(layer, cell.i, cell.j, state.timeIdx);
    lines.push(`${val !== null ? val.toFixed(3) : "?"} ${unit}`);
  }

  $("point-info").innerHTML =
    `<div style="margin-bottom:6px">` +
    (coords ? `<strong>lat ${coords.lat}°N, lon ${coords.lon}°E</strong><br>` : "") +
    `<span style="color:#5f6478;font-size:0.7rem">grid j=${cell.j}, i=${cell.i}</span></div>` +
    lines.map(l => `<div style="font-size:0.75rem;white-space:pre">${l}</div>`).join("");
});

// ── Coordinate layer loader ───────────────────────────────────────────────────

async function tryLoadCoords() {
  try {
    const [latResp, lonResp] = await Promise.all([
      fetch("layers/xlat.json"),
      fetch("layers/xlong.json"),
    ]);
    if (latResp.ok)  state.layerCache["__xlat__"]  = await latResp.json();
    if (lonResp.ok)  state.layerCache["__xlong__"] = await lonResp.json();
  } catch (_) {
    // Coordinate layers are optional
  }
}

// ── Initialisation ────────────────────────────────────────────────────────────

async function init() {
  showOverlay("Loading metadata…");

  // Determine base URL (works both when served and when opened as file://)
  let metaPath = CONFIG.metadataPath;
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has("data")) {
    metaPath = urlParams.get("data") + "/" + CONFIG.metadataPath;
  }

  let metadata;
  try {
    const resp = await fetch(metaPath);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    metadata = await resp.json();
  } catch (err) {
    showOverlay(
      `Could not load ${metaPath}.\n\n` +
      `Run the postprocessor first:\n  ./visualization/postprocess/run-demo.sh\n\n` +
      `Then serve the output directory:\n  ./visualization/web/serve.sh\n\n` +
      `Details: ${err.message}`,
      true
    );
    return;
  }

  state.metadata = metadata;
  $("job-id-label").textContent = `Job: ${metadata.jobId || "unknown"}`;

  const d = metadata.domain;
  $("sb-grid").textContent =
    `${d.nx || "?"} × ${d.ny || "?"} pts, dx=${(d.dx / 1000).toFixed(1)} km`;
  if (d.bounds && d.bounds.length >= 4) {
    $("sb-bounds").textContent =
      `${d.bounds[1].toFixed(1)}–${d.bounds[3].toFixed(1)}°N, ` +
      `${d.bounds[0].toFixed(1)}–${d.bounds[2].toFixed(1)}°E`;
  }

  // Build layer list
  const list = $("layer-list");
  list.innerHTML = "";
  for (const entry of metadata.layers) {
    const btn = document.createElement("button");
    btn.className = "layer-btn";
    btn.dataset.id = entry.id;
    btn.innerHTML =
      `${entry.label}` +
      `<div class="layer-meta">${entry.unit} · ${entry.type}</div>`;
    btn.addEventListener("click", () => activateLayer(entry.id));
    list.appendChild(btn);
  }

  // Load coordinate layers in background
  tryLoadCoords();

  // Activate first time-varying layer by default
  const firstTimeSeries = metadata.layers.find(l => l.type === "raster-time-series");
  const firstLayer = firstTimeSeries || metadata.layers[0];
  if (firstLayer) {
    await activateLayer(firstLayer.id);
  } else {
    hideOverlay();
  }
}

// ── Wire up controls ──────────────────────────────────────────────────────────

$("btn-prev").addEventListener("click", () => setTimeIdx(state.timeIdx - 1));
$("btn-next").addEventListener("click", () => setTimeIdx(state.timeIdx + 1));
$("btn-play").addEventListener("click", togglePlay);

$("time-slider").addEventListener("input", e => {
  setTimeIdx(parseInt(e.target.value, 10));
});

window.addEventListener("resize", () => {
  resizeCanvas();
  const layer = state.layerCache[state.activeLayerId];
  if (layer) renderLayer(layer, state.timeIdx);
});

resizeCanvas();
init();
</script>
</body>
</html>
