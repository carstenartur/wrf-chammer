name: Docker WPS Reproducible Build

# Trigger policy:
# - WRF source and repository-root build changes are included by default because
#   Dockerfile.wps compiles WRF before WPS;
# - fork-owned application, documentation, visualization and unrelated CI changes are excluded;
# - only scripts copied or invoked by this image are added back explicitly.
# Keep this contract synchronized with ci/verify-heavy-workflow-triggers.py.
on:
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!**/*.md'
      - '!workbench/**'
      - '!visualization/**'
      - '!ci/**'
      - '!.github/workflows/**'
      - 'ci/build-wps.sh'
      - 'ci/verify-wps-runtime.sh'
      - '.github/workflows/docker-wps-build.yml'
  push:
    branches: [master, develop]
    paths:
      - '**'
      - '!doc/**'
      - '!**/*.md'
      - '!workbench/**'
      - '!visualization/**'
      - '!ci/**'
      - '!.github/workflows/**'
      - 'ci/build-wps.sh'
      - 'ci/verify-wps-runtime.sh'
      - '.github/workflows/docker-wps-build.yml'
  workflow_dispatch:

concurrency:
  group: docker-wps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-wps-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build WPS Docker image
        run: docker build -f Dockerfile.wps --tag wps-reproducible .

      - name: Verify WPS runtime dependencies and startup
        run: docker run --rm wps-reproducible /usr/local/bin/verify-wps-runtime.sh
