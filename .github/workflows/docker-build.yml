name: Docker Reproducible Build

on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build --tag wrf-reproducible .

      - name: Verify runtime dependencies and startup
        run: docker run --rm wrf-reproducible /usr/local/bin/verify-wrf-runtime.sh

      - name: Run WRF smoke-test simulation
        run: docker run --rm wrf-reproducible /usr/local/bin/smoke-test-wrf.sh 2>&1 | tee /tmp/smoke-test-wrf.log

      - name: Run WRF smoke test via Workbench
        run: sh workbench/run.sh workbench/examples/wrf-smoke.json 2>&1 | tee /tmp/smoke-test-workbench.log

      - name: Upload smoke test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: /tmp/smoke-test-*.log
          if-no-files-found: ignore
