name: ERA5/WPS Integration Test

# Proves that the full WPS pipeline (GRIB → ungrib → metgrid → met_em) works
# using the bundled mini GRIB dataset. No CDS credentials or internet access
# are required during the WPS run itself; only the Docker build stage needs
# the network to clone upstream WPS from GitHub.
#
# Local equivalent:
#   sh ci/test-era5-wps-integration.sh
#
# Runtime budget:
#   First run  – up to 90 minutes (WRF + WPS compile from source).
#   Warm cache – target < 5 minutes (Docker layer cache restored from GHA cache).
#
# Trigger policy:
# - WRF source, Dockerfiles and bundled integration fixtures are included by default;
# - fork-owned application, migration, runtime delivery, documentation, visualization and unrelated CI changes are excluded;
# - only scripts copied into the ERA5 image or invoked by this integration test are added back.
# Keep this contract synchronized with ci/verify-heavy-workflow-triggers.py.
on:
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!migration/**'
      - '!runtime/**'
      - '!**/*.md'
      - '!workbench/**'
      - '!visualization/**'
      - '!ci/**'
      - '!.github/workflows/**'
      - '!Dockerfile*'
      - '!wrf-chammer'
      - 'Dockerfile.wps'
      - 'Dockerfile.era5'
      - 'ci/build-wps.sh'
      - 'ci/verify-wps-runtime.sh'
      - 'ci/download-era5.py'
      - 'ci/download-era5.sh'
      - 'ci/prepare-era5-wps.py'
      - 'ci/prepare-era5-wps.sh'
      - 'ci/run-era5-pipeline.sh'
      - 'ci/run-wps-step.py'
      - 'ci/verify-era5-outputs.sh'
      - 'ci/test-era5-wps-integration.sh'
      - '.github/workflows/wps-integration-test.yml'
  push:
    branches: [master, develop]
    paths:
      - '**'
      - '!doc/**'
      - '!migration/**'
      - '!runtime/**'
      - '!**/*.md'
      - '!workbench/**'
      - '!visualization/**'
      - '!ci/**'
      - '!.github/workflows/**'
      - '!Dockerfile*'
      - '!wrf-chammer'
      - 'Dockerfile.wps'
      - 'Dockerfile.era5'
      - 'ci/build-wps.sh'
      - 'ci/verify-wps-runtime.sh'
      - 'ci/download-era5.py'
      - 'ci/download-era5.sh'
      - 'ci/prepare-era5-wps.py'
      - 'ci/prepare-era5-wps.sh'
      - 'ci/run-era5-pipeline.sh'
      - 'ci/run-wps-step.py'
      - 'ci/verify-era5-outputs.sh'
      - 'ci/test-era5-wps-integration.sh'
      - '.github/workflows/wps-integration-test.yml'
  workflow_dispatch:

concurrency:
  group: era5-wps-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wps-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wps-reproducible
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.wps
          tags: wps-reproducible:latest
          load: true
          cache-from: type=gha,scope=wps-reproducible
          cache-to: type=gha,scope=wps-reproducible,mode=max

      - name: Build era5-pipeline
        run: |
          docker build \
            --build-arg WPS_IMAGE=wps-reproducible:latest \
            -f Dockerfile.era5 \
            -t era5-pipeline:latest \
            .

      - name: Run ERA5/WPS integration test
        env:
          ERA5_IMAGE: era5-pipeline:latest
          WORKDIR: /tmp/wps-integration-workdir
        run: sh ci/test-era5-wps-integration.sh

      - name: Package WPS logs on failure
        if: failure()
        run: |
          if [ -d /tmp/wps-integration-workdir ]; then
            tar -czf /tmp/wps-integration-logs.tar.gz -C /tmp wps-integration-workdir
          fi

      - name: Upload WPS logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wps-integration-logs
          path: /tmp/wps-integration-logs.tar.gz
          if-no-files-found: ignore
