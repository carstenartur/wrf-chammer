name: Persistent Job Orchestration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/job_store.py'
      - 'workbench/job_worker.py'
      - 'workbench/persistent_jobs.py'
      - 'workbench/server/application.py'
      - 'workbench/cli.py'
      - 'ci/test_persistent_job_store.py'
      - 'ci/test_persistent_job_api.py'
      - 'ci/test_worker_recovery.py'
      - 'ci/test_workbench_cli.py'
      - 'doc/JOB_ORCHESTRATION.md'
      - '.github/workflows/persistent-job-tests.yml'
  push:
    branches: [master, develop]
    paths:
      - 'workbench/job_store.py'
      - 'workbench/job_worker.py'
      - 'workbench/persistent_jobs.py'
      - 'workbench/server/application.py'
      - 'workbench/cli.py'
      - 'ci/test_persistent_job_store.py'
      - 'ci/test_persistent_job_api.py'
      - 'ci/test_worker_recovery.py'
      - 'ci/test_workbench_cli.py'
      - 'doc/JOB_ORCHESTRATION.md'
      - '.github/workflows/persistent-job-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistent-jobs:
    name: SQLite queue, worker, API, and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test SQLite store and standalone worker
        run: |
          if ! python3 ci/test_persistent_job_store.py > /tmp/persistent-store.log 2>&1; then
            cat /tmp/persistent-store.log
            exit 1
          fi
          cat /tmp/persistent-store.log

      - name: Test reused worker id recovery
        run: |
          if ! python3 ci/test_worker_recovery.py > /tmp/persistent-recovery.log 2>&1; then
            cat /tmp/persistent-recovery.log
            exit 1
          fi
          cat /tmp/persistent-recovery.log

      - name: Test persistent HTTP API and worker
        run: |
          if ! python3 ci/test_persistent_job_api.py > /tmp/persistent-api.log 2>&1; then
            cat /tmp/persistent-api.log
            exit 1
          fi
          cat /tmp/persistent-api.log

      - name: Test managed server and worker lifecycle
        run: |
          if ! python3 ci/test_workbench_cli.py > /tmp/persistent-cli.log 2>&1; then
            cat /tmp/persistent-cli.log
            exit 1
          fi
          cat /tmp/persistent-cli.log

      - name: Upload persistent job diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-job-test-logs
          path: /tmp/persistent-*.log
          if-no-files-found: warn
