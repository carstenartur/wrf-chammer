name: Fork CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell script validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on fork CI scripts
        run: |
          shellcheck --severity=error \
            ci/*.sh \
            workbench/run.sh \
            workbench/scripts/*.sh \
            visualization/tests/test_visualization.sh \
            visualization/postprocess/*.sh
