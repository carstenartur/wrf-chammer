name: Docker WPS Reproducible Build

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/e2e/**'
      - 'workbench/server/**'
      - 'workbench/domain_planner.py'
      - 'workbench/era5_planner.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/readiness.py'
      - 'workbench/cli.py'
      - 'visualization/**'
      - 'ci/download-era5.py'
      - 'ci/test-workbench-server.sh'
      - 'ci/test-workbench-web.sh'
      - 'ci/test_domain_planner.py'
      - 'ci/test_era5_planner.py'
      - 'ci/test_era5_downloader_security.py'
      - '.github/workflows/era5-data-api-tests.yml'
      - '.github/workflows/era5-planner-tests.yml'
      - '.github/workflows/user-guide-screenshots.yml'
      - '.github/workflows/workbench-tests.yml'
      - '.github/workflows/visualization-tests.yml'
  push:
    branches: [master, develop]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/e2e/**'
      - 'workbench/server/**'
      - 'workbench/domain_planner.py'
      - 'workbench/era5_planner.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/readiness.py'
      - 'workbench/cli.py'
      - 'visualization/**'
      - 'ci/download-era5.py'
      - 'ci/test-workbench-server.sh'
      - 'ci/test-workbench-web.sh'
      - 'ci/test_domain_planner.py'
      - 'ci/test_era5_planner.py'
      - 'ci/test_era5_downloader_security.py'
      - '.github/workflows/era5-data-api-tests.yml'
      - '.github/workflows/era5-planner-tests.yml'
      - '.github/workflows/user-guide-screenshots.yml'
      - '.github/workflows/workbench-tests.yml'
      - '.github/workflows/visualization-tests.yml'
  workflow_dispatch:

concurrency:
  group: docker-wps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-wps-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build WPS Docker image
        run: docker build -f Dockerfile.wps --tag wps-reproducible .

      - name: Verify WPS runtime dependencies and startup
        run: docker run --rm wps-reproducible /usr/local/bin/verify-wps-runtime.sh
