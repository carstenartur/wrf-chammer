name: User Guide Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/server/**'
      - 'workbench/e2e/**'
      - 'ci/generate-user-guide-screenshots.sh'
      - 'doc/USER_GUIDE.md'
      - 'doc/user-guide/**'
      - '.github/workflows/user-guide-screenshots.yml'
  push:
    branches-ignore:
      - master
    paths:
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/server/**'
      - 'workbench/e2e/**'
      - 'ci/generate-user-guide-screenshots.sh'
      - 'doc/USER_GUIDE.md'
      - 'doc/user-guide/**'
      - '.github/workflows/user-guide-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xaver-user-guide-screenshots:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[generated-screenshots]') }}
    name: Generate Xaver user-guide screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run screenshot integration test in Testcontainers
        run: |
          cd workbench/e2e
          npm install
          npm run screenshots:container

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: xaver-user-guide-screenshots
          path: doc/user-guide/screenshots/*.png
          if-no-files-found: error

      - name: Commit generated screenshots and built UI
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/user-guide/screenshots/*.png workbench/web/index.html workbench/web/app.js workbench/web/styles.css
          if git diff --cached --quiet; then
            echo "No generated screenshots or built UI changes to commit."
            exit 0
          fi
          git commit -m "Update generated user guide screenshots [generated-screenshots]"
          git push

      - name: Verify checked-in screenshots are current
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git diff --exit-code -- doc/user-guide/screenshots workbench/web
