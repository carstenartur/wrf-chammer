name: User Guide Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/server/**'
      - 'workbench/e2e/**'
      - 'ci/generate-user-guide-screenshots.sh'
      - 'doc/USER_GUIDE.md'
      - 'doc/user-guide/**'
      - '.github/workflows/user-guide-screenshots.yml'
  workflow_dispatch:

concurrency:
  group: user-guide-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # This branch performs one human-requested capture of one fixed viewport.
  # Before merge, pull-request CI is returned to the offline QA basemap.
  WRF_SCREENSHOT_BASEMAP: openstreetmap
  WRF_SCREENSHOT_OUTPUT_DIR: doc/user-guide/screenshots
  WRF_ALLOW_LIVE_OSM_SCREENSHOTS: '1'

jobs:
  xaver-user-guide-screenshots:
    name: Generate Xaver user-guide screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run screenshot integration test in Testcontainers
        run: |
          LOG_FILE="${RUNNER_TEMP}/user-guide-screenshots.log"
          if ! (
            cd workbench/e2e
            npm install
            npm run screenshots:container
          ) >"${LOG_FILE}" 2>&1
          then
            echo "Screenshot integration failed. Last 250 log lines:"
            tail -n 250 "${LOG_FILE}"
            exit 1
          fi
          echo "Screenshot integration succeeded. Last 60 log lines:"
          tail -n 60 "${LOG_FILE}"

      - name: Upload screenshot integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-screenshot-diagnostics
          path: ${{ runner.temp }}/user-guide-screenshots.log
          if-no-files-found: warn

      - name: Upload screenshots and basemap provenance
        uses: actions/upload-artifact@v4
        with:
          name: xaver-user-guide-screenshots
          path: |
            doc/user-guide/screenshots/*.png
            doc/user-guide/screenshots/*.provenance.json
          if-no-files-found: error

      - name: Upload generated UI assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-ui-assets
          path: |
            workbench/web/index.html
            workbench/web/app.js
            workbench/web/styles.css
          if-no-files-found: warn

      - name: Verify generated screenshots and OSM provenance exist
        run: |
          for file in \
            xaver-01-search.png \
            xaver-02-event-selected.png \
            xaver-03-domain-resolution.png \
            xaver-03b-map-domain-wizard.png \
            xaver-03c-era5-data-plan.png \
            xaver-04-preview-config.png \
            xaver-05-dry-run-status.png \
            xaver-06-logs.png
          do
            if [ ! -f "doc/user-guide/screenshots/${file}" ]; then
              echo "Missing generated screenshot: ${file}"
              exit 1
            fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          provenance = json.loads(Path('doc/user-guide/screenshots/xaver-03b-map-domain-wizard.png.provenance.json').read_text())
          assert provenance['basemap'] == 'openstreetmap-standard', provenance
          assert provenance['tile_host'] == 'tile.openstreetmap.org', provenance
          assert provenance['successful_tile_responses'] >= 4, provenance
          assert 'OpenStreetMap contributors' in provenance['attribution'], provenance
          print('OpenStreetMap screenshot provenance verified')
          PY
