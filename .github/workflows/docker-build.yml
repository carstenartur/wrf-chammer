name: Docker Reproducible Build

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/e2e/**'
      - 'workbench/server/**'
      - 'workbench/domain_planner.py'
      - 'workbench/era5_planner.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/era5_credential_service.py'
      - 'workbench/readiness.py'
      - 'workbench/cli.py'
      - 'visualization/**'
      - 'ci/download-era5.py'
      - 'ci/validate-cds-credentials.py'
      - 'ci/test-workbench-server.sh'
      - 'ci/test-workbench-web.sh'
      - 'ci/test_domain_planner.py'
      - 'ci/test_era5_planner.py'
      - 'ci/test_era5_downloader_security.py'
      - '.github/workflows/era5-data-api-tests.yml'
      - '.github/workflows/era5-planner-tests.yml'
      - '.github/workflows/user-guide-screenshots.yml'
      - '.github/workflows/workbench-tests.yml'
      - '.github/workflows/visualization-tests.yml'
  push:
    branches: [master, develop]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/e2e/**'
      - 'workbench/server/**'
      - 'workbench/domain_planner.py'
      - 'workbench/era5_planner.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/era5_credential_service.py'
      - 'workbench/readiness.py'
      - 'workbench/cli.py'
      - 'visualization/**'
      - 'ci/download-era5.py'
      - 'ci/validate-cds-credentials.py'
      - 'ci/test-workbench-server.sh'
      - 'ci/test-workbench-web.sh'
      - 'ci/test_domain_planner.py'
      - 'ci/test_era5_planner.py'
      - 'ci/test_era5_downloader_security.py'
      - '.github/workflows/era5-data-api-tests.yml'
      - '.github/workflows/era5-planner-tests.yml'
      - '.github/workflows/user-guide-screenshots.yml'
      - '.github/workflows/workbench-tests.yml'
      - '.github/workflows/visualization-tests.yml'
  workflow_dispatch:

concurrency:
  group: docker-wrf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        shell: bash
        run: |
          if ! docker build --progress=plain --tag wrf-reproducible . > /tmp/docker-build.log 2>&1; then
            echo "Docker build failed. Last 200 log lines:"
            tail -n 200 /tmp/docker-build.log
            exit 1
          fi
          tail -n 40 /tmp/docker-build.log

      - name: Verify runtime dependencies and startup
        run: docker run --rm wrf-reproducible /usr/local/bin/verify-wrf-runtime.sh

      - name: Run WRF smoke-test simulation
        run: docker run --rm wrf-reproducible /usr/local/bin/smoke-test-wrf.sh 2>&1 | tee /tmp/smoke-test-wrf.log

      - name: Run WRF smoke test via Workbench
        run: sh workbench/run.sh workbench/examples/wrf-smoke.json 2>&1 | tee /tmp/smoke-test-workbench.log

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-and-smoke-test-logs
          path: /tmp/*build*.log
          if-no-files-found: ignore
