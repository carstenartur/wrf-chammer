name: Docker Reproducible Build

# Trigger policy:
# - upstream/scientific source and repository-root build changes are included by default;
# - fork-owned application, documentation, visualization and unrelated CI changes are excluded;
# - only the Workbench smoke-test dependencies used below are added back explicitly.
# Keep this contract synchronized with ci/verify-heavy-workflow-triggers.py.
on:
  pull_request:
    paths:
      - '**'
      - '!doc/**'
      - '!**/*.md'
      - '!workbench/**'
      - '!visualization/**'
      - '!ci/**'
      - '!.github/workflows/**'
      - '!Dockerfile*'
      - '!wrf-chammer'
      - 'Dockerfile'
      - 'workbench/run.sh'
      - 'workbench/validate.py'
      - 'workbench/config/**'
      - 'workbench/examples/wrf-smoke.json'
      - 'workbench/scripts/run-wrf-smoke.sh'
      - 'ci/build-wrf.sh'
      - 'ci/find-netcdff-library.sh'
      - 'ci/_run_wrf_step_core.py'
      - 'ci/run-wrf-step.py'
      - 'ci/verify-wrf-runtime.sh'
      - 'ci/smoke-test-wrf.sh'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [master, develop]
    paths:
      - '**'
      - '!doc/**'
      - '!**/*.md'
      - '!workbench/**'
      - '!visualization/**'
      - '!ci/**'
      - '!.github/workflows/**'
      - '!Dockerfile*'
      - '!wrf-chammer'
      - 'Dockerfile'
      - 'workbench/run.sh'
      - 'workbench/validate.py'
      - 'workbench/config/**'
      - 'workbench/examples/wrf-smoke.json'
      - 'workbench/scripts/run-wrf-smoke.sh'
      - 'ci/build-wrf.sh'
      - 'ci/find-netcdff-library.sh'
      - 'ci/_run_wrf_step_core.py'
      - 'ci/run-wrf-step.py'
      - 'ci/verify-wrf-runtime.sh'
      - 'ci/smoke-test-wrf.sh'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: docker-wrf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        shell: bash
        run: |
          if ! docker build --progress=plain --tag wrf-reproducible . > /tmp/docker-build.log 2>&1; then
            echo "Docker build failed. Last 200 log lines:"
            tail -n 200 /tmp/docker-build.log
            exit 1
          fi
          tail -n 40 /tmp/docker-build.log

      - name: Verify runtime dependencies and startup
        run: docker run --rm wrf-reproducible /usr/local/bin/verify-wrf-runtime.sh

      - name: Run WRF smoke-test simulation
        run: docker run --rm wrf-reproducible /usr/local/bin/smoke-test-wrf.sh 2>&1 | tee /tmp/smoke-test-wrf.log

      - name: Run WRF smoke test via Workbench
        run: sh workbench/run.sh workbench/examples/wrf-smoke.json 2>&1 | tee /tmp/smoke-test-workbench.log

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-and-smoke-test-logs
          path: /tmp/*build*.log
          if-no-files-found: ignore
