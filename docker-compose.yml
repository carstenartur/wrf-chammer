# docker-compose.yml — WRF Workbench MVP local runner
#
# Minimal Compose file for running the Workbench MVP locally.
# Executes workbench/run.sh inside a lightweight Python container with the
# repository and run-directory volumes mounted.
#
# Usage:
#   # Dry-run (no Docker images required for WRF/WPS):
#   docker compose run --rm workbench workbench/examples/xaver-dry-run.json
#
#   # ERA5 offline validation:
#   docker compose run --rm workbench workbench/examples/era5-offline.json
#
#   # WRF smoke test (requires wrf-reproducible image to be built first):
#   #   docker build -f Dockerfile -t wrf-reproducible:latest .
#   docker compose run --rm -v /var/run/docker.sock:/var/run/docker.sock \
#       workbench workbench/examples/wrf-smoke.json
#
# Run directories are written to ./workbench-runs/ on the host.
# See workbench/README.md for full documentation.

services:

  workbench:
    image: python:3.11-slim
    working_dir: /repo
    entrypoint: ["sh", "workbench/run.sh"]
    volumes:
      - .:/repo:ro
      - ./workbench-runs:/repo/workbench-runs
