name: Workbench MVP Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench-tests:
    name: Workbench MVP test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate event catalogue and presets
        run: sh ci/test-event-catalogue.sh

      - name: Run Workbench tests
        run: sh ci/test-workbench.sh

      - name: Run local Workbench API tests
        run: sh ci/test-workbench-server.sh
