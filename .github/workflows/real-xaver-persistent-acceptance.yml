name: Real Xaver Persistent Acceptance

on:
  workflow_dispatch:
    inputs:
      plan_key:
        description: Complete checksum-verified ERA5 plan key
        required: true
        type: string
      cache_root:
        description: Absolute ERA5 cache root on the self-hosted runner
        required: true
        default: /srv/wrf-chammer/era5-cache
        type: string
      geog_root:
        description: Absolute real WPS_GEOG directory on the self-hosted runner
        required: true
        default: /srv/wrf-chammer/WPS_GEOG
        type: string
      start:
        description: UTC simulation start
        required: true
        default: '2013-12-05T12:00:00Z'
        type: string
      end:
        description: UTC simulation end
        required: true
        default: '2013-12-06T06:00:00Z'
        type: string
      west:
        description: Western longitude
        required: true
        default: '2.0'
        type: string
      south:
        description: Southern latitude
        required: true
        default: '51.0'
        type: string
      east:
        description: Eastern longitude
        required: true
        default: '13.0'
        type: string
      north:
        description: Northern latitude
        required: true
        default: '58.0'
        type: string
      quality_profile:
        description: Domain quality profile
        required: true
        default: balanced
        type: choice
        options:
          - quick-preview
          - balanced
          - detailed

permissions:
  contents: read

concurrency:
  group: real-xaver-persistent-acceptance
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  real-xaver:
    # The runner must provide Docker, sufficient RAM/disk, the selected complete
    # ERA5 cache and a real WPS geography archive. GitHub-hosted runners are not
    # accepted for this scientific/manual workflow.
    runs-on: [self-hosted, linux, x64, wrf-chammer-real]
    timeout-minutes: 1440
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 1

      - name: Verify self-hosted prerequisites
        shell: bash
        env:
          INPUT_PLAN_KEY: ${{ inputs.plan_key }}
          INPUT_CACHE_ROOT: ${{ inputs.cache_root }}
          INPUT_GEOG_ROOT: ${{ inputs.geog_root }}
        run: |
          set -euo pipefail
          command -v docker
          command -v python3
          command -v git
          [[ "${INPUT_PLAN_KEY}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${INPUT_CACHE_ROOT}" = /* ]]
          [[ "${INPUT_GEOG_ROOT}" = /* ]]
          test -d "${INPUT_CACHE_ROOT}"
          test -d "${INPUT_CACHE_ROOT}/${INPUT_PLAN_KEY}"
          test -d "${INPUT_GEOG_ROOT}"
          test -n "$(find "${INPUT_GEOG_ROOT}" -mindepth 1 -print -quit)"
          test -z "$(git status --porcelain)"
          docker info >/dev/null

      - name: Build pinned WPS runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.wps \
            -t "wrf-chammer-wps-base:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .
          docker build \
            --build-arg "WPS_IMAGE=wrf-chammer-wps-base:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f Dockerfile.era5 \
            -t "wrf-chammer-wps:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .

      - name: Build pinned WRF runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile \
            -t "wrf-chammer-wrf:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .

      - name: Build pinned postprocessing runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.postprocessing \
            -t "wrf-chammer-postprocessing:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .

      - name: Pin local image identities
        shell: bash
        run: |
          set -euo pipefail
          WPS_REFERENCE="wrf-chammer-wps:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WRF_REFERENCE="wrf-chammer-wrf:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          POST_REFERENCE="wrf-chammer-postprocessing:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WPS_IDENTITY="$(docker image inspect --format '{{.Id}}' "${WPS_REFERENCE}")"
          WRF_IDENTITY="$(docker image inspect --format '{{.Id}}' "${WRF_REFERENCE}")"
          POST_IDENTITY="$(docker image inspect --format '{{.Id}}' "${POST_REFERENCE}")"
          for identity in "${WPS_IDENTITY}" "${WRF_IDENTITY}" "${POST_IDENTITY}"; do
            printf '%s\n' "${identity}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done
          {
            echo "WRF_CHAMMER_WPS_IMAGE_REFERENCE=${WPS_REFERENCE}"
            echo "WRF_CHAMMER_WPS_IMAGE_IDENTITY=${WPS_IDENTITY}"
            echo "WRF_CHAMMER_WRF_IMAGE_REFERENCE=${WRF_REFERENCE}"
            echo "WRF_CHAMMER_WRF_IMAGE_IDENTITY=${WRF_IDENTITY}"
            echo "WRF_CHAMMER_POSTPROCESSING_IMAGE_REFERENCE=${POST_REFERENCE}"
            echo "WRF_CHAMMER_POSTPROCESSING_IMAGE_IDENTITY=${POST_IDENTITY}"
          } >> "${GITHUB_ENV}"

      - name: Run persistent eight-step Xaver acceptance
        shell: bash
        env:
          INPUT_PLAN_KEY: ${{ inputs.plan_key }}
          INPUT_CACHE_ROOT: ${{ inputs.cache_root }}
          INPUT_GEOG_ROOT: ${{ inputs.geog_root }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_WEST: ${{ inputs.west }}
          INPUT_SOUTH: ${{ inputs.south }}
          INPUT_EAST: ${{ inputs.east }}
          INPUT_NORTH: ${{ inputs.north }}
          INPUT_QUALITY_PROFILE: ${{ inputs.quality_profile }}
          REPORT_PATH: workbench-runs/acceptance/xaver-${{ github.run_id }}-${{ github.run_attempt }}/report.json
        run: |
          set -euo pipefail
          python3 ci/run-real-xaver-acceptance.py \
            --cache-root "${INPUT_CACHE_ROOT}" \
            --plan-key "${INPUT_PLAN_KEY}" \
            --geog-root "${INPUT_GEOG_ROOT}" \
            --job-id "xaver-real-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --start "${INPUT_START}" \
            --end "${INPUT_END}" \
            --west "${INPUT_WEST}" \
            --south "${INPUT_SOUTH}" \
            --east "${INPUT_EAST}" \
            --north "${INPUT_NORTH}" \
            --quality-profile "${INPUT_QUALITY_PROFILE}" \
            --pipeline-profile small-real-data-demo \
            --report "${REPORT_PATH}"
          echo "REAL_XAVER_REPORT=${REPORT_PATH}" >> "${GITHUB_ENV}"

      - name: Package accepted result evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID="$(python3 -c 'import json,os; print(json.load(open(os.environ["REAL_XAVER_REPORT"]))["job_id"])')"
          EVIDENCE="${RUNNER_TEMP}/real-xaver-evidence"
          mkdir -p "${EVIDENCE}"
          cp "${REAL_XAVER_REPORT}" "${EVIDENCE}/report.json"
          cp "${REAL_XAVER_REPORT%.json}.md" "${EVIDENCE}/report.md"
          cp -a "workbench-runs/simulations/${JOB_ID}/results" "${EVIDENCE}/results"
          cp -a "workbench-runs/simulations/${JOB_ID}/visualizations" "${EVIDENCE}/visualizations"
          printf '%s\n' "${JOB_ID}" > "${EVIDENCE}/job-id.txt"

      - name: Upload accepted result evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-xaver-persistent-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-xaver-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure report and local logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-xaver-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workbench-runs/acceptance
            workbench-runs/simulations/*/steps/*/*.log
            workbench-runs/simulations/*/steps/*/*.json
          if-no-files-found: ignore
          retention-days: 14
