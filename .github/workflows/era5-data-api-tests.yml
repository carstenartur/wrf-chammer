name: ERA5 Data API Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workbench/era5_service.py'
      - 'workbench/era5_planner.py'
      - 'workbench/server/application.py'
      - 'workbench/server/tests/test_era5_data_api.py'
      - '.github/workflows/era5-data-api-tests.yml'
  push:
    branches: [master, develop]
    paths:
      - 'workbench/era5_service.py'
      - 'workbench/era5_planner.py'
      - 'workbench/server/application.py'
      - 'workbench/server/tests/test_era5_data_api.py'
      - '.github/workflows/era5-data-api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: era5-data-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Credential-safe ERA5 planning API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local ERA5 data API tests
        run: python3 workbench/server/tests/test_era5_data_api.py
