name: ERA5/WPS Integration Test

# Proves that the full WPS pipeline (GRIB → ungrib → metgrid → met_em) works
# using the bundled mini GRIB dataset. No CDS credentials or internet access
# are required during the WPS run itself; only the Docker build stage needs
# the network to clone upstream WPS from GitHub.
#
# Local equivalent:
#   sh ci/test-era5-wps-integration.sh
#
# Runtime budget:
#   First run  – up to 90 minutes (WRF + WPS compile from source).
#   Warm cache – target < 5 minutes (Docker layer cache restored from GHA cache).

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/e2e/**'
      - 'workbench/server/**'
      - 'workbench/domain_planner.py'
      - 'workbench/era5_planner.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/era5_credential_service.py'
      - 'workbench/readiness.py'
      - 'workbench/cli.py'
      - 'visualization/**'
      - 'ci/download-era5.py'
      - 'ci/validate-cds-credentials.py'
      - 'ci/test-workbench-server.sh'
      - 'ci/test-workbench-web.sh'
      - 'ci/test_domain_planner.py'
      - 'ci/test_era5_planner.py'
      - 'ci/test_era5_downloader_security.py'
      - '.github/workflows/era5-data-api-tests.yml'
      - '.github/workflows/era5-planner-tests.yml'
      - '.github/workflows/user-guide-screenshots.yml'
      - '.github/workflows/workbench-tests.yml'
      - '.github/workflows/visualization-tests.yml'
  push:
    branches: [master, develop]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'workbench/ui/**'
      - 'workbench/web/**'
      - 'workbench/e2e/**'
      - 'workbench/server/**'
      - 'workbench/domain_planner.py'
      - 'workbench/era5_planner.py'
      - 'workbench/era5_service.py'
      - 'workbench/era5_download_manager.py'
      - 'workbench/era5_cache_service.py'
      - 'workbench/era5_credential_service.py'
      - 'workbench/readiness.py'
      - 'workbench/cli.py'
      - 'visualization/**'
      - 'ci/download-era5.py'
      - 'ci/validate-cds-credentials.py'
      - 'ci/test-workbench-server.sh'
      - 'ci/test-workbench-web.sh'
      - 'ci/test_domain_planner.py'
      - 'ci/test_era5_planner.py'
      - 'ci/test_era5_downloader_security.py'
      - '.github/workflows/era5-data-api-tests.yml'
      - '.github/workflows/era5-planner-tests.yml'
      - '.github/workflows/user-guide-screenshots.yml'
      - '.github/workflows/workbench-tests.yml'
      - '.github/workflows/visualization-tests.yml'
  workflow_dispatch:

concurrency:
  group: era5-wps-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wps-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wps-reproducible
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.wps
          tags: wps-reproducible:latest
          load: true
          cache-from: type=gha,scope=wps-reproducible
          cache-to: type=gha,scope=wps-reproducible,mode=max

      - name: Build era5-pipeline
        run: |
          docker build \
            --build-arg WPS_IMAGE=wps-reproducible:latest \
            -f Dockerfile.era5 \
            -t era5-pipeline:latest \
            .

      - name: Run ERA5/WPS integration test
        env:
          ERA5_IMAGE: era5-pipeline:latest
          WORKDIR: /tmp/wps-integration-workdir
        run: sh ci/test-era5-wps-integration.sh

      - name: Package WPS logs on failure
        if: failure()
        run: |
          if [ -d /tmp/wps-integration-workdir ]; then
            tar -czf /tmp/wps-integration-logs.tar.gz -C /tmp wps-integration-workdir
          fi

      - name: Upload WPS logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wps-integration-logs
          path: /tmp/wps-integration-logs.tar.gz
          if-no-files-found: ignore
